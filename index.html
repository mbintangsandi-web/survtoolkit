<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SURVTOOLKIT</title>
<link rel="stylesheet" href="shared/theme.css">
<style>

  .wrap {
    max-width: 640px;
    margin: 0 auto;
    padding: 64px 24px 60px;
  }

  header.hero {
    text-align: center;
    margin-bottom: 44px;
  }
  header.hero .eyebrow { display: block; margin-bottom: 10px; }
  header.hero h1 {
    font-size: 30px;
    color: var(--text);
  }
  header.hero h1 span { color: var(--accent); }
  header.hero p {
    color: var(--text-dim);
    font-size: 14px;
    margin: 10px 0 0;
  }

  /* ---------------------------------------------------------------
     Menu — vertical stack of large buttons, one job each.
     --------------------------------------------------------------- */
  .menu {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .menu-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 22px 24px;
    transition: border-color 0.15s ease, transform 0.15s ease, background 0.15s ease;
  }
  a.menu-item:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
    transform: translateX(2px);
  }
  .menu-item.disabled { opacity: 0.6; cursor: default; }
  .menu-item.disabled:hover { border-color: var(--border); background: var(--panel); transform: none; }

  /* Locked — blur + coming soon badge */
  .menu-item.locked {
    position: relative;
    cursor: not-allowed;
    overflow: hidden;
  }
  .menu-item.locked:hover { border-color: var(--border); background: var(--panel); transform: none; }
  .menu-item.locked .menu-item__body {
    filter: blur(3.5px);
    user-select: none;
    pointer-events: none;
  }
  .menu-item.locked .menu-item__chevron {
    filter: blur(3.5px);
    pointer-events: none;
  }
  .menu-item.locked::after {
    content: '🔒 Coming Soon';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.04em;
    color: var(--accent);
    background: rgba(0,0,0,0.18);
    backdrop-filter: blur(1px);
    -webkit-backdrop-filter: blur(1px);
    border-radius: inherit;
  }

  .menu-item__body { flex: 1; min-width: 0; }
  .menu-item__title {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15.5px;
    color: var(--text);
  }
  .menu-item__desc {
    font-size: 12.5px;
    color: var(--text-dim);
    margin-top: 3px;
    line-height: 1.5;
  }

  .menu-item__chevron {
    color: var(--text-faint);
    font-size: 18px;
    flex-shrink: 0;
  }
  a.menu-item:hover .menu-item__chevron { color: var(--accent); }

  footer {
    text-align: center;
    margin-top: 48px;
    font-size: 11.5px;
    color: var(--text-faint);
  }
</style>
</head>
<body>

  <div class="wrap">

    <header class="hero">
      <span class="eyebrow">SURVEILLANCE FM</span>
      <h1>SURV<span>TOOLKIT</span></h1>
      <p>Pilih menu di bawah untuk mulai.</p>
    </header>

    <nav class="menu" id="menu"></nav>

    <footer id="lastvisit"></footer>

  </div>

<script src="shared/utils.js"></script>
<script>
  // ------------------------------------------------------------------
  // Menu utama — mengikuti diagram alur: 4 tombol besar.
  // "Report Daily OLT Down" dan "Alarm" membuka halaman berikutnya
  // (hub) yang menampilkan langkah/cabang di dalamnya. Tambah menu
  // baru cukup tambah satu entri di sini.
  // ------------------------------------------------------------------
  const MENU = [
    {
      title: 'Tiket Lebih Dari 3 Hari',
      desc: 'Checkpoint Tiket Gangguan dan Keluhan setiap Jam 06.00 dan 14.00.',
      href: 'tools/followup-ticket.html',
      status: 'active',
    },
    {
      title: 'OLT Down Lebih Dari 8 Jam',
      desc: 'Blast Update dan Follow Up Tiap Akhir Shift (06.00, 14.00, & 22.00).',
      href: 'tools/outage-broadcast.html',
      status: 'active',
    },
    {
      title: 'Report Daily OLT Down',
      desc: 'Blast Tiap Jam 08.00, 10.00, 14.00, 17.00, 20.00, & 22.00.',
      href: 'tools/report-daily-olt-down.html',
      status: 'active',
    },
    {
      title: 'Alarm',
      desc: 'Broadcast alarm MAJOR & CRITICAL perangkat HUAWEI DAN FIBERHOME.',
      href: 'tools/alarm.html',
      status: 'active',
    },
    {
      title: 'GPS Incident Broadcast',
      desc: 'Update posisi Active GPS / peta incident per region tiap jam 08.00.',
      href: 'tools/gps-incident-broadcast.html',
      status: 'active',
    },
    {
      title: 'VIP Broadcast Generator',
      desc: 'Generate broadcast VIP customer secara otomatis.',
      href: 'tools/vip-broadcast-generator.html',
      status: 'active',
    },
    {
      title: 'Temp Over Broadcast Generator',
      desc: 'Broadcast BNG/INETGW/CGNAT yang melebihi threshold suhu.',
      href: 'tools/temp-over-broadcast.html',
      status: 'active',
    },
    {
      title: 'Daily Checklist',
      desc: 'Checklist jobdesc harian per jam, tiga shift, dengan rekap skor.',
      href: 'tools/daily-checklist.html',
      status: 'locked',
    },
  ];

  const menuEl = document.getElementById('menu');
  menuEl.innerHTML = MENU.map(m => {
    const isActive = m.status === 'active';
    const isLocked = m.status === 'locked';
    const tag = isActive ? 'a' : 'div';
    const hrefAttr = isActive ? `href="${m.href}"` : '';
    let cls = 'menu-item panel';
    if (!isActive && !isLocked) cls += ' disabled';
    if (isLocked) cls += ' locked';
    return `
      <${tag} class="${cls}" ${hrefAttr}>
        <div class="menu-item__body">
          <div class="menu-item__title">${m.title}</div>
          <div class="menu-item__desc">${m.desc}</div>
        </div>
        <div class="menu-item__chevron">${isActive ? '›' : ''}</div>
      </${tag}>
    `;
  }).join('');

  document.getElementById('lastvisit').textContent =
    'SURVEILLANCE FM · ' + NetopsUtils.formatTimestampID(new Date());
</script>

</body>
</html>
