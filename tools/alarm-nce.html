<title>Alarm Broadcast · NCE — SURVTOOLKIT</title>
<link rel="stylesheet" href="../shared/theme.css">

<body>

<div class="tool-wrap tool-wrap--wide">
  <a class="back-link" href="alarm.html">← Alarm</a>
  
  <div class="tool-hero">
    <span class="eyebrow">SURVTOOLKIT</span>
    <h1>Alarm Broadcast · <span>NCE</span></h1>
    <p>Paste data TSV dari sistem monitoring &rarr; generate broadcast per SBU/region</p>
  </div>

  <div class="panel">
    <div class="panel-header">Input Data <span class="badge badge--info" style="margin-left:auto">TSV / Paste dari Excel</span></div>
    <div class="panel-body" style="padding:16px;">
      <textarea id="inputData" placeholder="Paste data di sini (dengan header: Operation, Severity, First Occurred (ST), Cleared On (ST), Occurrences, Name, Alarm Source, ...)" style="margin-bottom:16px;"></textarea>
      
      <div class="toolbar">
        <button class="primary" onclick="generateBroadcast()">▶ Generate Broadcast</button>
        <button class="btn" onclick="loadSample()">📋 Sample Data</button>
        <button class="btn" onclick="resetAll()">✕ Reset</button>
      </div>
      
      <div class="stat-grid" id="statsBar" style="margin-top:16px; margin-bottom: 0;"></div>
    </div>
  </div>

  <div class="panel" id="outputPanel" style="display:none;">
    <div class="panel-header">Broadcast Output (per SBU/Region)</div>
    <div class="panel-body" style="padding:16px;">
      <div class="region-tabs" id="regionTabs"></div>
      
      <div id="outputContainer" style="margin-bottom: 16px;"></div>
      
      <div class="toolbar" style="margin-bottom: 0;">
        <button class="primary" onclick="copyAll()">📄 Copy Semua Region</button>
      </div>
    </div>
  </div>

  <div class="panel" id="emptyPanel">
    <div class="panel-body" style="padding:40px 16px; text-align:center; color:var(--text-dim); font-size:13px;">
      Belum ada data. Paste data lalu klik "Generate Broadcast", atau coba "Sample Data".
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

function getRegion(alarmSource){
  if(!alarmSource) return 'UNKNOWN';
  const idx = alarmSource.indexOf('-');
  if(idx === -1) return alarmSource.trim();
  return alarmSource.substring(0, idx).trim();
}

function extractTime(dateTimeStr){
  if(!dateTimeStr) return '';
  const parts = dateTimeStr.trim().split(' ');
  return parts.length > 1 ? parts[1] : dateTimeStr.trim();
}

function findCol(headers, ...names){
  for(const name of names){
    const idx = headers.findIndex(h => h.trim().toLowerCase() === name.toLowerCase());
    if(idx !== -1) return idx;
  }
  return -1;
}

function generateBroadcast(){
  const raw = document.getElementById('inputData').value;
  if(!raw.trim()){
    alert('Data input kosong. Paste data terlebih dahulu.');
    return;
  }
  const lines = raw.split('\n').filter(l => l.trim() !== '');
  if(lines.length < 2){
    alert('Data tidak lengkap. Pastikan ada header dan minimal 1 baris data.');
    return;
  }
  const headers = lines[0].split('\t');
  const colFirstOccurred = findCol(headers, 'First Occurred (ST)', 'First Occurred');
  const colName = findCol(headers, 'Name');
  const colAlarmSource = findCol(headers, 'Alarm Source');

  if(colFirstOccurred === -1 || colName === -1 || colAlarmSource === -1){
    alert('Header tidak dikenali. Pastikan kolom "First Occurred (ST)", "Name", dan "Alarm Source" ada.');
    return;
  }

  broadcastData = {};
  regionOrder = [];
  const seenKeys = new Set();
  let totalRows = 0;
  let uniqueAlarms = 0;

  for(let i = 1; i < lines.length; i++){
    const cols = lines[i].split('\t');
    const alarmSource = (cols[colAlarmSource] || '').trim();
    const name = (cols[colName] || '').trim();
    const firstOccurred = (cols[colFirstOccurred] || '').trim();
    if(!alarmSource || !name || !firstOccurred) continue;

    totalRows++;
    const dedupKey = alarmSource + '|' + name + '|' + firstOccurred;
    if(seenKeys.has(dedupKey)) continue;
    seenKeys.add(dedupKey);
    uniqueAlarms++;

    const region = getRegion(alarmSource);
    if(!broadcastData[region]){
      broadcastData[region] = [];
      regionOrder.push(region);
    }
    broadcastData[region].push({
      olt: alarmSource,
      time: extractTime(firstOccurred),
      name: name
    });
  }

  if(regionOrder.length === 0){
    alert('Tidak ada data valid yang bisa diproses.');
    return;
  }

  renderStats(totalRows, uniqueAlarms, regionOrder.length);
  renderOutput();
}

function createStatCard(label, value){
  const card = document.createElement('div');
  card.className = 'stat-card';
  card.style.background = 'var(--bg-raised)';
  card.style.border = '1.5px solid var(--border)';
  card.style.borderRadius = 'var(--radius)';
  card.innerHTML = `
    <div class="stat-card__value stat-card__value--accent">${value}</div>
    <div class="stat-card__label">${label}</div>
  `;
  return card;
}

function renderStats(totalRows, uniqueAlarms, regionCount){
  const statsBar = document.getElementById('statsBar');
  statsBar.innerHTML = '';
  statsBar.appendChild(createStatCard('Total Baris', totalRows));
  statsBar.appendChild(createStatCard('Alarm Unik', uniqueAlarms));
  statsBar.appendChild(createStatCard('Region/SBU', regionCount));
}

function buildBroadcastText(region){
  const items = broadcastData[region];
  let msg = `‼️BROADCAST ALARM‼️\nYth. Rekan SBU ${region},\nTelah terdeteksi Alarm Environment pada perangkat OLT.\nDibantu untuk pengecekan\n\n`;
  items.forEach((item, idx) => {
    msg += `${idx + 1}. ${item.olt} ${item.time} ${item.name}\n`;
  });
  msg += `\n#envalarm\ncc : `;
  return msg;
}

function renderOutput(){
  document.getElementById('outputPanel').style.display = 'block';
  document.getElementById('emptyPanel').style.display = 'none';

  const tabsEl = document.getElementById('regionTabs');
  tabsEl.innerHTML = regionOrder.map(r =>
    `<div class="region-tab" onclick="scrollToRegion('${r}')">${r} (${broadcastData[r].length})</div>`
  ).join('');

  const container = document.getElementById('outputContainer');
  container.innerHTML = regionOrder.map(region => `
    <div class="panel" id="region-${region}" style="background:var(--bg-raised); margin-bottom:14px; border:1.5px solid var(--border);">
      <div class="output-card__bar">
        <div class="output-card__title">SBU ${region}</div>
        <button class="btn btn-sm" onclick="copyRegion('${region}')">📋 Copy</button>
      </div>
      <div class="output-box" style="padding:16px;">${NetopsUtils.escapeHtml(buildBroadcastText(region))}</div>
    </div>
  `).join('');
}

function scrollToRegion(region){
  const el = document.getElementById('region-' + region);
  if(el) el.scrollIntoView({behavior:'smooth', block:'center'});
}

function copyRegion(region){
  const text = buildBroadcastText(region);
  NetopsUtils.copyToClipboard(text).then(() => {
    NetopsUtils.showToast(\`Broadcast SBU ${region} disalin!\`);
  });
}

function copyAll(){
  let all = regionOrder.map(r => buildBroadcastText(r)).join('\n\n' + '─'.repeat(40) + '\n\n');
  NetopsUtils.copyToClipboard(all).then(() => {
    NetopsUtils.showToast('Semua broadcast disalin!');
  });
}

function resetAll(){
  document.getElementById('inputData').value = '';
  document.getElementById('statsBar').innerHTML = '';
  document.getElementById('outputPanel').style.display = 'none';
  document.getElementById('emptyPanel').style.display = 'block';
  broadcastData = {};
  regionOrder = [];
}
</script>
