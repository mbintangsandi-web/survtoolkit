<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Report Daily OLT Down · SURVTOOLKIT</title>
<link rel="stylesheet" href="../shared/theme.css">
<style>

  /* ── Header bar (matches daily-report.html style) ── */
  .header {
    border-bottom: 1.5px solid var(--border);
    padding: 14px 24px;
    display: flex;
    align-items: center;
    gap: 16px;
    background: var(--panel);
  }

  .header-logo {
    font-family: var(--font-display);
    font-size: 11px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .header-divider {
    width: 1px;
    height: 18px;
    background: var(--border-bright);
  }

  .header-title {
    font-family: var(--font-display);
    font-size: 13px;
    font-weight: 700;
    color: var(--text);
    letter-spacing: 0.04em;
  }

  .header-clock {
    margin-left: auto;
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
  }

  /* ── Content wrap ── */
  .wrap { max-width: 640px; margin: 0 auto; padding: 32px 24px 60px; }

  .back {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 13px;
    color: var(--text-dim);
    margin-bottom: 28px;
    transition: color 0.15s;
  }
  .back:hover { color: var(--accent); }

  /* ── Hero section with blue accent ── */
  header.hero { margin-bottom: 36px; }
  header.hero .eyebrow { display: block; margin-bottom: 8px; }
  header.hero h1 { font-size: 24px; color: var(--text); }
  header.hero h1 span { color: var(--accent); }
  header.hero p { color: var(--text-dim); font-size: 14px; margin: 8px 0 0; line-height: 1.6; }

  /* ── Blue accent bar under hero ── */
  .accent-strip {
    height: 3px;
    background: linear-gradient(90deg, var(--accent), var(--accent-dim));
    border-radius: 2px;
    margin-bottom: 32px;
  }

  /* ---------------------------------------------------------------
     Sequential flow — numbering is meaningful here: this is a real
     3-step pipeline, each step depends on the previous one's output.
     --------------------------------------------------------------- */
  .flow { display: flex; flex-direction: column; }

  .step {
    display: flex;
    align-items: flex-start;
    gap: 18px;
  }

  .step__rail {
    display: flex;
    flex-direction: column;
    align-items: center;
    flex-shrink: 0;
  }
  .step__num {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: var(--accent);
    color: #fff;
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 8px rgba(47, 111, 228, 0.25);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .step:hover .step__num {
    transform: scale(1.08);
    box-shadow: 0 4px 14px rgba(47, 111, 228, 0.35);
  }
  .step.idle .step__num { background: var(--signal-idle); box-shadow: none; }
  .step__line {
    width: 2px;
    flex: 1;
    background: var(--border-bright);
    margin: 4px 0;
    min-height: 28px;
  }

  .step__card {
    flex: 1;
    padding: 18px 20px;
    margin-bottom: 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    transition: border-color 0.15s ease, background 0.15s ease;
    border-left: 3px solid transparent;
  }
  a.step__card:hover {
    border-color: var(--accent);
    background: var(--accent-dim);
    border-left-color: var(--accent);
  }
  .step__card.disabled { opacity: 0.65; cursor: default; }

  .step__title { font-family: var(--font-display); font-weight: 700; font-size: 15px; color: var(--text); }
  .step__desc { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.5; }

  .step__chevron {
    color: var(--text-faint);
    font-size: 18px;
    flex-shrink: 0;
    transition: color 0.15s, transform 0.15s;
  }
  a.step__card:hover .step__chevron {
    color: var(--accent);
    transform: translateX(3px);
  }
</style>
</head>
<body>

  <!-- ── Header bar matching daily-report style ── -->
  <div style="display:block;padding:8px 24px 0;color:var(--text-dim);font-size:11px;font-family:var(--font-display);font-weight:600;">
    <a href="../index.html" style="color:var(--text-dim);text-decoration:none;transition:color 0.15s;"
       onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-dim)'">&larr; Kembali ke Menu Utama</a>
  </div>
  <header class="header">
    <span class="header-logo">SURVTOOLKIT</span>
    <span class="header-divider"></span>
    <span class="header-title">Report Daily OLT Down</span>
    <span class="header-clock" id="clock">--:--:--</span>
  </header>

  <div class="wrap">

    <header class="hero">
      <span class="eyebrow">Alur Kerja</span>
      <h1>Report Daily <span>OLT Down</span></h1>
      <p>Tiga langkah berurutan: pisahkan status device, sinkronkan hasil, lalu susun laporan harian. Klik langkah untuk membuka tool-nya.</p>
    </header>

    <!-- Blue accent strip -->
    <div class="accent-strip"></div>

    <div class="flow" id="flow"></div>

  </div>

<script src="../shared/utils.js"></script>
<script>
  const STEPS = [
    {
      title: 'Split Done / Not Done',
      desc: 'Pisahkan daftar device dari data mentah berdasarkan status DONE / NOT DONE.',
      href: 'done-notdone.html',
      status: 'active',
    },
    {
      title: 'Sync',
      desc: 'Sinkronkan hasil split dengan sumber data pembanding (dashboard/recap).',
      href: 'sync.html',
      status: 'active',
    },
    {
      title: 'Daily Report',
      desc: 'Susun hasil akhir menjadi format laporan harian siap kirim.',
      href: 'daily-report.html',
      status: 'active',
    },
  ];

  const flowEl = document.getElementById('flow');
  flowEl.innerHTML = STEPS.map((s, i) => {
    const isActive = s.status === 'active';
    const isLast = i === STEPS.length - 1;
    const tag = isActive ? 'a' : 'div';
    const hrefAttr = isActive ? `href="${s.href}"` : '';
    const cardCls = isActive ? 'step__card panel' : 'step__card panel disabled';
    return `
      <div class="step ${isActive ? '' : 'idle'}">
        <div class="step__rail">
          <div class="step__num">${i + 1}</div>
          ${isLast ? '' : '<div class="step__line"></div>'}
        </div>
        <${tag} class="${cardCls}" ${hrefAttr}>
          <div>
            <div class="step__title">${s.title}</div>
            <div class="step__desc">${s.desc}</div>
          </div>
          <div class="step__chevron">${isActive ? '›' : ''}</div>
        </${tag}>
      </div>
    `;
  }).join('');

  // live clock
  function tick() {
    const now = new Date();
    document.getElementById('clock').textContent =
      now.toLocaleTimeString('id-ID', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
  tick();
  setInterval(tick, 1000);
</script>

<div style="text-align:center;padding:20px 0 40px;"><a href="../index.html" style="color:#5c7290;font-size:13px;text-decoration:none;">← Kembali ke Menu Utama</a></div>

</body>
</html>
